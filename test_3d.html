<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test MapLibre 3D Santiago</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; background: #08080a; color: #fff; }
        #map { width: 100%; height: 100%; }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(18, 18, 23, 0.9);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #2b2b3e;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover {
            background: #ffe066;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="btn-toggle-cam">📐 Alternar Modo Construcción (2D Cenital) / Juego (2.5D)</button>
        <span id="cam-status" style="font-size: 13px; color: #aaa;">Cámara: 2.5D (Inclinación 55°)</span>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
        let is2D = false;

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',
            center: [-70.6500, -33.4380], // Santiago Centro
            zoom: 15.8,
            pitch: 55, // Inclinación 2.5D inicial
            bearing: -15, // Ligera rotación
            canvasContextAttributes: { antialias: true }
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

        map.on('load', () => {
            console.log('Map loaded, injecting 3D building extrusions...');
            
            // Hide 2D flat footprints
            if (map.getLayer('building')) {
                map.setLayoutProperty('building', 'visibility', 'none');
            }

            // Find place labels layer so roads are drawn under buildings
            const layers = map.getStyle().layers;
            let targetBeforeId = null;
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].id && layers[i].id.startsWith('place_')) {
                    targetBeforeId = layers[i].id;
                    break;
                }
            }

            const sourceName = map.getSource('openmaptiles') ? 'openmaptiles' : null;

            if (sourceName) {
                map.setLight({
                    anchor: 'viewport',
                    color: '#ffffff',
                    intensity: 0.55,
                    position: [1.25, 120, 50]
                });

                map.addLayer({
                    'id': '3d-buildings',
                    'source': sourceName,
                    'source-layer': 'building',
                    'type': 'fill-extrusion',
                    'minzoom': 13.0,
                    'paint': {
                        'fill-extrusion-color': [
                            'interpolate',
                            ['linear'],
                            ['coalesce', ['get', 'render_height'], ['get', 'height'], 12],
                            0, '#30344a',
                            20, '#3d4361',
                            50, '#4e567d',
                            100, '#636e9e',
                            200, '#7b89c4',
                            300, '#93a3e6'
                        ],
                        'fill-extrusion-height': [
                            'interpolate',
                            ['linear'],
                            ['zoom'],
                            13.0, 0,
                            14.2, ['coalesce', ['get', 'render_height'], ['get', 'height'], 12]
                        ],
                        'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
                        'fill-extrusion-opacity': [
                            'interpolate',
                            ['linear'],
                            ['zoom'],
                            13.0, 1.0,
                            16.8, 1.0,
                            17.8, 0.72,
                            19.0, 0.45
                        ]
                    }
                }, targetBeforeId);
            }
        });

        // Alternar cámara 2.5D <-> 2D
        document.getElementById('btn-toggle-cam').addEventListener('click', () => {
            is2D = !is2D;
            const statusEl = document.getElementById('cam-status');
            if (is2D) {
                // Modo construcción cenital plano (2D)
                map.easeTo({
                    pitch: 0,
                    bearing: 0,
                    duration: 900
                });
                statusEl.textContent = 'Cámara: 2D Cenital (Modo Construcción)';
                statusEl.style.color = '#ffcc00';
            } else {
                // Modo juego 2.5D
                map.easeTo({
                    pitch: 55,
                    bearing: -15,
                    duration: 900
                });
                statusEl.textContent = 'Cámara: 2.5D (Inclinación 55°)';
                statusEl.style.color = '#aaa';
            }
        });
    </script>
</body>
</html>
